书面日语能力评估标准:
  meta:
    version: "1.4"
    updated: "2025-10-30"
    目标: "仅评书面；以语境适配(Register-fit)为核心，面向母语级掌握；应试题型仅作刻意练习载体。"
    适用范围: ["进阶评估","改写/微写作训练","题库/课程对齐","周期性追踪(周/月)"]

  评分口径:
    StyleProfile_体裁声明:
      字段:
        domain: ["学术","商务","公文","新闻/报道","评测/说明","报告/摘要","社媒","对话","小说/随笔","日志"]
        formality: ["very_formal","formal","neutral","casual","slangy"]
        politeness: ["常体","です/ます","である","敬语(尊/谦)"]
        medium: ["print","web","chat"]
        persona: "（可选）叙述者/角色/组织身份"
      判定原则:
        - NAT 以与 StyleProfile 的匹配度为准；非机械“避口语化”。
        - 允许 style-shift（上/下调），须边界清楚（旁白/对话、角色/作者）。
        - 多声部文：声部内一致，声部间允许差异并需标界。
    指标与权重:
      ACC_准确性:
        weight: 0.5
        定义: "形态/助词/搭配/语义正确性；关键错=致歧义/违常理/换义。"
        扣分: {关键错: "-0.20/处(至0封顶)", 一般错: "-0.05/处", 格助词错: "-0.10/处"}
      NAT_自然度(=Register-fit):
        weight: 0.3
        定义: "与 StyleProfile 的语体/搭配/口吻/用词匹配与一致性。"
        观察点: ["体裁一致","常见构式/固定搭配","语域选择贴合","多声部边界清楚","并行结构一致"]
      ROB_稳健度:
        weight: 0.2
        定义: "改写/合用/换境下语义与语体的稳定（含受 StyleProfile 约束的 style-shift 能力）。"
        校验集: ["肯↔否","非过去↔过去","常体↔です/ます/である","同族点合用","并列↔嵌入互改","必要的风格上/下调"]
    评分公式: "总分 = 0.5*ACC + 0.3*NAT + 0.2*ROB（四舍五入到 0.01）"
    等级阈值:
      L1_可用: "总分≥0.60 且 ACC≥0.55"
      L2_自如: "总分≥0.75 且 ACC≥0.70、ROB≥0.65"
      L3_灵活: "总分≥0.85 且 ACC≥0.80、ROB≥0.80、NAT≥0.80"
    任务梯度与取样:
      T1_识别填空: "最小对比/义类辨析/变形；6–10题/点；StyleProfile=neutral 评分。"
      T2_改写对比: "强制改写(肯/否/时体/体裁/合用)；3–5题/点；至少一次 style-shift。"
      T3_微写作: "80–120字/段；目标点≥2次；按声明的 StyleProfile 评分。"
      综合评测取样: "每叶覆盖 T1+T2+T3；或模块抽样但须含 T3。"
      抽查评测取样: "仅抽涉及叶子；至少覆盖 T2 或 T3。"
    打分卡使用:
      形态A_综合卡:
        列顺序必须: ["大类","小类","具体要点","分数","证据(优势或劣势)"]
        附加列建议: ["等级","ACC/NAT/ROB","StyleProfile","下一步动作"]
        证据写法: "总结性‘擅长/薄弱簇’+（可选）代表片段；需注明 StyleProfile。"
      形态B_抽查卡:
        列顺序必须: ["大类","小类","具体要点","分数","证据(优势或劣势)"]
        附加列建议: ["任务(T1/T2/T3)","样例摘录/题干摘要","StyleProfile","快速改写建议"]
        证据写法: "具体 case（原句/题干→问题点→改写）并标注当次 StyleProfile。"
    边界处理:
      NA_不适用: "某项不评 NAT/ROB 时，标 NA 并在证据栏说明；不计入均分。"
      同分决策: "先看 ACC，再看该 StyleProfile 下的 NAT。"
      质量门槛: "模板拼接/AI味重且与 StyleProfile 不符→NAT≤0.50；该点最高≤0.70。"

  A_形态·句法:
    A1_时体与相:
      - id: A1-1
        名: "〜ている（三义）"
        判焦: "进行/结果状态/习惯；自他动词配合"
        L1: "三义各造1句；助词正确"
        L2: "进行↔結果互改不换义；配时间副词稳定"
        L3: "段落内三义各≥1；语域一致、零误读"
      - id: A1-2
        名: "〜てある（结果存续）"
        判焦: "他动+对象性；与受身区分"
        L1: "对象+は/が+〜てある 正确"
        L2: "与『〜ている(結果)』对比改写不换义"
        L3: "说明文≥2处自然使用并能解释选式"
      - id: A1-3
        名: "〜ておく（预置）"
        判焦: "目的/事前准备；与ために/前に协同"
        L1: "预先语境造句正确"
        L2: "与时间/目的表达合用无冲突"
        L3: "流程说明段自然≥2处"
      - id: A1-4
        名: "〜てしまう（完成/遗憾）"
        判焦: "两义；『てしまう/ちゃう』按 StyleProfile 选"
        L1: "两义各造句；neutral/formal 优先『てしまう』"
        L2: "叙事/反省区分得当；casual/chat 可用『ちゃう』且文风一致"
        L3: "段内两义各≥1；能做对话(casual)↔旁白(formal)清晰分界"
      - id: A1-5
        名: "ところ（V辞/ている/た+ところ）"
        判焦: "起始/进行中/刚完结的相位"
        L1: "三式各造句"
        L2: "叙事链准确切换相位"
        L3: "流程/时间轴描述自然"
      - id: A1-6
        名: "〜つつある／〜まま"
        判焦: "渐变进程/状态保持"
        L1: "基本造句正确"
        L2: "与时体/被动/结果相合用不冲突"
        L3: "趋势或对照段落中自然"
      - id: A1-7
        名: "自他×意志性（対応と制約）"
        判焦: "自他対応与意志/非意志的搭配约束；与 たい/意志形/てある/可能形/授受 的相容性"
        L1: "标注给定动词『自/他』『意志/非意志』并各造1句；判明 〜たい/意志形 仅接意志动词，〜てある 仅接他动词"
        L2: "作『自↔他』『意志表述↔非意志叙述』双向改写且不换义；格助词同步正确"
        L3: "80–120字中自然应用并处理例外（如 道を歩く 等）；语义/焦点稳定"
    A2_极性·副词:
      - id: A2-1
        名: "否定（〜ない/なくて/なかった）"
        判焦: "なくて 连接；与 ほど…ない"
        L1: "三式正确；无歧义"
        L2: "与程度/对比结构合用正确"
        L3: "段落否定多样且自然"
      - id: A2-2
        名: "程度副词（とても/かなり/少し/めっちゃ…）"
        判焦: "强度梯度×体裁"
        L1: "基本搭配正确"
        L2: "梯度选择贴合 StyleProfile"
        L3: "段落≥3种梯度且风格稳定"
      - id: A2-3
        名: "频度副词（よく/たまに/ほとんど〜ない）"
        判焦: "与否定共现；位置/语气"
        L1: "频度表达正确"
        L2: "与 ほとんど〜ない 合用不冲突"
        L3: "频度分布与叙述一致"
      - id: A2-4
        名: "焦点/限定（だけ/こそ/ばかり/しか〜ない）"
        判焦: "しか 需否定；强调语用"
        L1: "だけ/しか 区分"
        L2: "formal 减少感叹式强化"
        L3: "焦点策略服务论旨不突兀"
      - id: A2-5
        名: "否定变体（〜ないで/〜ずに/〜わけではない/〜とは限らない）"
        判焦: "不做/未做；部分否定"
        L1: "区分 ないで/ずに 与 〜なくて"
        L2: "部分否定运用正确"
        L3: "段落中用部分否定缓和断言"
    A3_可能·模态·样态/推定·传闻:
      - id: A3-1
        名: "可能形"
        判焦: "一段/五段；能力/许可/客观可行"
        L1: "变形/基本义正确"
        L2: "与条件/授受合用稳定"
        L3: "可行性段≥2次并给出选式理由"
      - id: A3-2
        名: "样态/比况（ようだ/みたい/〜っぽい/〜げ/かのようだ/ごとく/そうだ〈样态〉）"
        判焦: "比况vs外观推量；语域差异：みたい/っぽい(口语)↔ようだ/かのようだ(书面)"
        L1: "能区分并各造句(≥3类)"
        L2: "同一命题在 みたい↔ようだ↔かのようだ 间改写符合 StyleProfile"
        L3: "段内选择稳定；必要时用 〜ように見える/〜気味 化解歧义"
      - id: A3-3
        名: "传闻（〜そうだ〈伝聞〉/〜とのことだ/〜とか/〜って）"
        判焦: "来源×体裁：社媒/对话可『〜って/〜とか』；公文/报道用『〜とのことだ/〜と伝えられている』"
        L1: "正确标出来源"
        L2: "按 StyleProfile 做『って↔とのことだ』改写"
        L3: "新闻/报告体中传闻标记一致"
      - id: A3-4
        名: "推量·确定度（だろう/でしょう/かもしれない/に違いない/はずだ）"
        判焦: "主观把握度刻度；礼貌/体裁匹配"
        L1: "刻度方向正确(可能性从低到高)"
        L2: "在议论文/报告中切换『でしょう/と考えられる』等不违和"
        L3: "同段内多档推量并能解释选式理由"
    A4_语态·使役:
      - id: A4-1
        名: "受身"
        判焦: "直接/间接；に/を；信息焦点"
        L1: "能动↔受身互改正确"
        L2: "叙述中焦点不丢"
        L3: "与原因/让步合用自然"
      - id: A4-2
        名: "使役（〜せる/〜させる）"
        判焦: "强制/许可；敬体"
        L1: "两义各造句"
        L2: "礼貌梯度改写到位"
        L3: "规约/流程文自然嵌入≥2"
      - id: A4-3
        名: "使役受身（〜させられる）"
        判焦: "冗长度；不及物配合"
        L1: "形态正确"
        L2: "能动/受身/使役受身三向互改"
        L3: "经历叙述自然、不累赘"
    A5_条件·让步:
      - id: A5-1
        名: "〜ば（一般条件）"
        判焦: "普适/规则句"
        L1: "规则句正确"
        L2: "与否定/可能合用"
        L3: "方案条件段主干用ば"
      - id: A5-2
        名: "〜たら（先后/一次性）"
        判焦: "事件链/完成先后"
        L1: "事件链正确"
        L2: "ば↔たら 改写不换义"
        L3: "叙事段自然切换"
      - id: A5-3
        名: "〜と（恒常/自动结果）"
        判焦: "机理/习性"
        L1: "习性句正确"
        L2: "与ば 对比恰当"
        L3: "说明文主干稳定"
      - id: A5-4
        名: "〜なら（前提限定/接话题）"
        判焦: "以对方信息为前提"
        L1: "接话题得体"
        L2: "四式配对≥80%"
        L3: "能解释选式理由"
      - id: A5-5
        名: "〜ても/〜でも（让步）"
        判焦: "让步强度；与 のに 区分"
        L1: "基本造句"
        L2: "让步 vs 逆接受理"
        L3: "对照段自然"
    A6_因果·连接:
      - id: A6-1
        名: "から/ので/ため（原因）"
        判焦: "体裁选择=StyleProfile"
        L1: "句对换正确"
        L2: "formal/public 优先『ので/ため』"
        L3: "长句连接顺滑"
      - id: A6-2
        名: "目的の『ために』"
        判焦: "名词修饰歧义回避"
        L1: "目的句正确"
        L2: "原因↔目的 改写"
        L3: "规约/说明文自然"
      - id: A6-3
        名: "接续词（因此/然而/此外/总之）"
        判焦: "逻辑位置与一致性"
        L1: "句首/句中用法正确"
        L2: "段内逻辑一致"
        L3: "信息流顺滑"
    A7_助词·名词化:
      - id: A7-1
        名: "は/が（主题vs主格）"
        判焦: "新信息=が；话题/对比=は"
        L1: "选择填空≥80%"
        L2: "信息结构改写不失真"
        L3: "说明段首 が→后续 は 自然"
      - id: A7-2
        名: "に/で（着点/存在 vs 场所/手段）"
        判焦: "作用点区分"
        L1: "情景配对正确"
        L2: "句群改写不变义"
        L3: "操作说明稳定"
      - id: A7-3
        名: "を/と（宾格/并列·引用）"
        判焦: "用法边界；固定搭配"
        L1: "基本搭配正确"
        L2: "引用『と』与说话动词协同"
        L3: "段内一致"
      - id: A7-4
        名: "名词化（〜こと/〜の）"
        判焦: "抽象vs具体；固定句式"
        L1: "选式正确"
        L2: "互改保持语气"
        L3: "规约偏『こと』自然"

  B_功能·语用:
    B1_请求·许可·禁止·建议:
      - id: B1-1
        名: "〜てください"
        判焦: "直接度/礼貌"
        L1: "基本请求句"
        L2: "与敬语搭配恰当"
        L3: "通知体裁自然"
      - id: B1-2
        名: "〜てもいい"
        判焦: "许可语气"
        L1: "许可正确"
        L2: "与条件/范围合用"
        L3: "规约限制清楚"
      - id: B1-3
        名: "〜てはいけない"
        判焦: "禁止强度/适用对象"
        L1: "禁止句正确"
        L2: "场景/对象匹配"
        L3: "风险提示清楚"
      - id: B1-4
        名: "〜たほうがいい"
        判焦: "建议强弱与因果"
        L1: "基本建议"
        L2: "与原因连接自然"
        L3: "对策段可读"
    B2_愿望·意志·计划:
      - id: B2-1
        名: "〜たい"
        判焦: "主观愿望；主语限制"
        L1: "句法正确"
        L2: "与时间/目的合用"
        L3: "计划段自然"
      - id: B2-2
        名: "〜つもりだ"
        判焦: "计划确定性"
        L1: "表意清楚"
        L2: "与条件/因果协同"
        L3: "进度描述稳定"
      - id: B2-3
        名: "意志形（〜よう）"
        判焦: "提议 vs 自我意志"
        L1: "形态正确"
        L2: "语用不混淆"
        L3: "文风统一"
    B3_立场·引述:
      - id: B3-1
        名: "と思う/と考える"
        判焦: "主观性强度；文体匹配"
        L1: "正确嵌入"
        L2: "与证据句衔接"
        L3: "议论文自然"
      - id: B3-2
        名: "によれば/によると"
        判焦: "信息来源规范"
        L1: "标注来源"
        L2: "与传闻式协同"
        L3: "报导体一致"
      - id: B3-3
        名: "と述べる/と主張する"
        判焦: "报道动词选用与一致性"
        L1: "动词匹配语气"
        L2: "引用边界清晰"
        L3: "段内一致"

  C_句式·篇章:
    C1_四大句型:
      - id: C1-1
        名: "名词句（NはNだ/です）"
        判焦: "断定/定义；主题化"
        L1: "判断句正确"
        L2: "与限定/比较协同"
        L3: "定义段起句得体"
      - id: C1-2
        名: "形容词句（い/な述语）"
        判焦: "い/な；く/に 转换与时体"
        L1: "述语正确"
        L2: "く/に/连体稳定"
        L3: "描写段搭配自然"
      - id: C1-3
        名: "动词句（动作/状态）"
        判焦: "自他/及物；时体一致"
        L1: "基本句正确"
        L2: "与补助/趋向合用"
        L3: "过程描述流畅"
      - id: C1-4
        名: "存在句（ある/いる）"
        判焦: "无/有生命；位置表达"
        L1: "区分无误"
        L2: "に/で/にある 搭配正确"
        L3: "场景描写自然"
    C2_文体·语域:
      - id: C2-1
        名: "文体统一（です/ます vs である）"
        判焦: "声部内一致；跨声部可差异但需标界"
        L1: "单一文体无混用"
        L2: "正式场景匹配"
        L3: "可作受众导向的 style-shift 且不违和"
      - id: C2-2
        名: "敬语书面化（尊敬/自谦/丁寧）"
        判焦: "主体方向；二重敬语回避"
        L1: "敬语正确"
        L2: "误用率<5%"
        L3: "商务/公告文得体"
      - id: C2-3
        名: "固定格式（书信/通知起讫语）"
        判焦: "套语与结构"
        L1: "套语正确"
        L2: "结构完整"
        L3: "风格稳定无口语化"
    C3_段落·逻辑:
      - id: C3-1
        名: "主题句"
        判焦: "开篇定主题；信息序"
        L1: "有主题句"
        L2: "段内围绕主题"
        L3: "多段层级清楚"
      - id: C3-2
        名: "照应与指代一致"
        判焦: "代词/省略清晰性"
        L1: "指代不歧义"
        L2: "跨句照应准确"
        L3: "全文可追"
      - id: C3-3
        名: "段落过渡（因果/转折/递进/总结）"
        判焦: "过渡词位置与逻辑"
        L1: "用法正确"
        L2: "段间关系清楚"
        L3: "信息流顺滑"
      - id: C3-4
        名: "列挙・並列（Vて连鎖/名词列举/接续词运用）"
        判焦: "列举完备性与并行性；Vて 连鎖长度控制；と/や/および/ならびに/また/そして 的语域与覆盖"
